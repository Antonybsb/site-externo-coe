<section class="py-12 bg-gray-50 w-full">
    <div class="container px-4 lg:px-0">

        <app-section-header titulo="Dicas de Saúde - Disaud" variante="branco" />

        @if (isLoading()) {
        <div class="flex justify-center py-10">
            <div class="w-8 h-8 border-4 border-azul-coe-escurissimo border-t-transparent rounded-full animate-spin">
            </div>
        </div>
        }

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
            @for (dica of dicas(); track dica.id) {
            <div
                class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-all group border border-gray-100 flex flex-col h-full">

                <div class="relative h-44 overflow-hidden">
                    <img [src]="dica.imagem || 'assets/placeholder-banner.png'"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        [alt]="dica.titulo">
                </div>

                <div class="p-5 flex flex-col flex-1">
                    <h3
                        class="font-bold text-gray-900 leading-tight mb-2 line-clamp-2 group-hover:text-emerald-600 transition-colors">
                        {{ dica.titulo }}
                    </h3>

                    <p class="text-sm text-gray-600 line-clamp-3 mb-4 flex-1">
                        {{ dica.resumo }}
                    </p>

                    <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-100">
                        <span class="text-[10px] font-bold text-gray-400 uppercase">
                            {{ dica.data | date: "dd/MM/yyyy" }}
                        </span>

                        @if (dica.pdfUrl) {
                        <a [href]="dica.pdfUrl" target="_blank"
                            class="flex items-center gap-1.5 text-azul-coe-escurissimo font-extrabold text-[11px] hover:underline">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                                    stroke-width="2" />
                            </svg>
                            SLIDES (PDF)
                        </a>
                        }
                    </div>
                </div>
            </div>
            } @empty {
            <p class="col-span-full text-center text-gray-500 py-10">Nenhuma dica disponível no momento.</p>
            }
        </div>
    </div>
</section>
