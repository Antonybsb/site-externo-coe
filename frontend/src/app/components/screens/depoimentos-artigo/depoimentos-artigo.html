<app-container-padrao>
    @if (!isLoading() && artigo(); as dados) {
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mt-[168px] mb-20">

        <article class="lg:col-span-8 lg:col-start-3 flex flex-col gap-8">
            <div class="mt-8">
                <app-breadcrumb [items]="breadcrumbItems()"></app-breadcrumb>
            </div>

            <header class="border-b border-gray-100 pb-6">
                <h1 class="text-3xl md:text-4xl font-bold text-azul-coe-escurissimo leading-tight mb-3">
                    {{ dados.nome }}
                </h1>

                <div class="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-wide">
                    <span class="text-gray-900">COE - TCU</span>
                    <span>•</span>
                    <span>{{ dados.data | date: "dd 'de' MMMM 'de' yyyy" }}</span>
                </div>
            </header>

            <div
                class="border-l-4 border-yellow-400 pl-6 py-2 my-2 italic text-xl text-gray-800 font-medium bg-gray-50 rounded-r-lg">
                "{{ dados.resumo }}"
            </div>

            @if (dados.imagemConteudoUrl) {
            <figure class="w-full flex flex-col">
                <img [src]="dados.imagemConteudoUrl" [alt]="dados.nome"
                    class="w-full h-auto object-cover rounded-2xl shadow-sm">

                <figcaption class="text-xs text-gray-400 text-left leading-snug mt-3 italic pl-0.5">
                    Imagem ilustrativa relacionada ao relato de {{ dados.nome | titlecase }}.
                </figcaption>
            </figure>
            }



            <div class="text-lg text-gray-600 leading-relaxed space-y-6 text-justify" [innerHTML]="dados.conteudo">
            </div>

            <div class="mt-12 pt-8 border-t border-gray-200">
                <a routerLink="/depoimentos">
                    <button
                        class="flex items-center text-emerald-600 font-bold hover:text-emerald-700 transition-colors gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Voltar para depoimentos
                    </button>
                </a>
            </div>
        </article>

    </div>
    } @else {
    <div class="flex justify-center items-center h-64 mt-[168px]">
        <p class="text-gray-400 italic">Carregando depoimento...</p>
    </div>
    }
</app-container-padrao>
