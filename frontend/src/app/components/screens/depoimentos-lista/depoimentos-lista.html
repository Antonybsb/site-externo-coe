<div class="secao-conteudo py-12">
    <app-section-header titulo="Experiências que inspiram e transformam" variante="branco" class="block mt-[143.2px]">
    </app-section-header>

    <div class="mt-10 mb-12 container">
        <p class="text-gray-600 text-lg px-3 lg:px-0">Confira o relato de quem já faz parte dessa comunidade.</p>
    </div>

    <div class="container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-3 lg:px-0 mb-16">
        @for (item of historiasExibidas(); track item.id) {
        <a [routerLink]="['/depoimento-artigo', item.id]"
            class="group block relative h-[380px] rounded-2xl overflow-hidden shadow-lg cursor-pointer">

            <img [src]="item.imagemCardUrl ? 'http://localhost:1337' + item.imagemCardUrl : 'assets/placeholder.png'"
                [alt]="item.nome"
                class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">

            <div
                class="absolute bottom-0 left-0 w-full h-[60%] bg-gradient-to-t from-[var(--color-azul-hero)] via-[var(--color-azul-hero)] to-transparent opacity-95 transition-opacity group-hover:opacity-100">
            </div>

            <div class="absolute bottom-0 left-0 w-full p-5 text-white z-10 flex flex-col justify-end h-full">
                <div class="mb-2 text-yellow-400"></div>
                <h3 class="text-lg font-bold mb-2 text-yellow-400 leading-tight">{{ item.nome }}</h3>
                <p class="text-sm leading-relaxed text-gray-100 line-clamp-4 font-medium opacity-95 pr-6">"{{
                    item.resumo }}"</p>
            </div>
        </a>
        }
    </div>

    <div
        class="container flex flex-col sm:flex-row items-center justify-between pt-8 border-t border-gray-200 text-sm text-gray-500 gap-4 px-3 lg:px-0">
        <span>Exibindo {{ itemInicial }}-{{ itemFinal }} de {{ totalItens() }} itens</span>

        <div class="flex items-center gap-2">
            <button (click)="mudarPagina(paginaAtual() - 1)" [disabled]="paginaAtual() === 1"
                class="p-2 rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            @for (pag of paginasArray(); track pag) {
            <button (click)="mudarPagina(pag)"
                class="w-8 h-8 rounded border flex items-center justify-center transition-colors hover:bg-gray-50"
                [class.bg-blue-50]="pag === paginaAtual()" [class.text-blue-600]="pag === paginaAtual()"
                [class.border-blue-200]="pag === paginaAtual()" [class.border-gray-200]="pag !== paginaAtual()">
                {{ pag }}
            </button>
            }

            <button (click)="mudarPagina(paginaAtual() + 1)" [disabled]="paginaAtual() === paginasArray().length"
                class="p-2 rounded hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
</div>
